name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh
      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: shell tests
        run: bats tests/

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - name: lint
        run: make lint
      - name: render
        run: |
          helm template acme charts/odoo-tenant --namespace acme \
            --set tenant.name=acme --set tenant.hostname=acme.odoo.local > /dev/null

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - name: install dependencies
        run: pip install -r requirements-dev.txt
      - name: chart unit tests
        run: python3 -m pytest tests/ -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans commit history, so a shallow clone would miss the
          # commits where a credential would most likely be introduced.
          fetch-depth: 0
      - name: gitleaks
        run: |
          # The action for this wants a licence on private repositories, and the
          # scanner itself does not, so it is fetched directly and pinned.
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      - name: trivy
        run: |
          # The action offers no input for Helm values, and without them trivy
          # does not render the chart at all: it logs a render error and exits
          # zero, so the chart's own misconfigurations were never scanned. The
          # binary is fetched directly and pinned, like gitleaks above.
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" trivy
          # --ignore-unfixed: unfixed findings are not actionable here, and the
          # scan only stays worth reading if it is quiet when there is nothing
          # to fix. --ignorefile: the scoped KSV-0109 exception, which trivy
          # only reads from the default name in its plain-text form.
          "$RUNNER_TEMP/trivy" fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --helm-values tenants/acme.yaml \
            --exit-code 1 \
            .

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard is a diff, so it needs the base ref and enough history to
          # resolve it.
          fetch-depth: 0
      - name: the tenant tier and the platform tier do not move together
        run: |
          # They are different owners and different ArgoCD projects: the
          # platform tier is admin-level, because it may write the argocd
          # namespace and every namespace the platform occupies, while the
          # tenant tier may not. A diff that spans both is a diff no single
          # reviewer is placed to judge, and it is the shape a change takes when
          # someone has quietly acquired rights over the other tier.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000) base="" ;;
          esac
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            # First push to a branch, or a history that cannot supply the range.
            if git rev-parse --verify --quiet "HEAD~1" >/dev/null; then
              base="HEAD~1"
            else
              echo "single-commit history: nothing to compare against"
              exit 0
            fi
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "comparing $base..HEAD"
          echo "$changed"
          tenants=""
          platform=""
          if echo "$changed" | grep -q '^tenants/'; then tenants=yes; fi
          if echo "$changed" | grep -q '^platform/'; then platform=yes; fi
          if [ -n "$tenants" ] && [ -n "$platform" ]; then
            echo "::error::this diff changes both tenants/ and platform/. Split it: a platform change alters the cluster the tenants run on, and belongs to the platform tier and its ArgoCD project."
            exit 1
          fi
