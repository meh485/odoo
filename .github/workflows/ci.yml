name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh
      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: shell tests
        run: bats tests/

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - name: lint
        run: make lint
      - name: render
        run: |
          helm template acme charts/odoo-tenant --namespace acme \
            --set tenant.name=acme --set tenant.hostname=acme.odoo.local > /dev/null

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: azure/setup-helm@v4
        with: { version: v3.16.4 }
      - name: install dependencies
        run: pip install -r requirements-dev.txt
      - name: chart unit tests
        run: python3 -m pytest tests/ -q
