# Where tenant credentials actually live. The chart declares the ExternalSecrets
# and a per-tenant SecretStore; this is the namespace those stores read from,
# holding one Secret per tenant, seeded by scripts/seed-tenant-credentials.sh --
# which is the stand-in for Vault.
#
# The readers are not here: each tenant's Application creates its own, and its
# Role scopes that reader to one named Secret with resourceNames. A single
# reader for this namespace would need `get` across all of them, so any namespace
# allowed to create an ExternalSecret could read another tenant's credentials --
# one mistake would expose every customer at once.
#
# Nothing here changes when the backend becomes Vault: the ExternalSecrets and
# the Secret names they produce stay exactly the same.
apiVersion: v1
kind: Namespace
metadata:
  name: odoo-credentials
  labels:
    app.kubernetes.io/part-of: odoo
    # Credentials, not workloads: nothing runs here.
    pod-security.kubernetes.io/enforce: restricted
