# Where tenant credentials actually live, and how External Secrets reads them.
#
# The chart declares ExternalSecrets; this is the store they read from. Locally
# that store is a Kubernetes namespace holding one Secret per tenant, seeded by
# scripts/seed-tenant-credentials.sh -- which is the stand-in for Vault. Nothing
# here changes when the backend becomes Vault: the ExternalSecrets and the
# Secret names they produce stay exactly the same.
#
# Pinning the reader ServiceAccount's namespace (rather than using referent
# authentication) keeps RBAC to a single binding in a single namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: odoo-credentials
  labels:
    app.kubernetes.io/part-of: odoo
    # Credentials, not workloads: nothing runs here.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: credential-reader
  namespace: odoo-credentials
---
# Read-only, and only in this namespace. The operator creates a token for this
# ServiceAccount to authenticate to the API as a reader.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credential-reader
  namespace: odoo-credentials
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credential-reader
  namespace: odoo-credentials
subjects:
  - kind: ServiceAccount
    name: credential-reader
    namespace: odoo-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credential-reader
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: tenant-credentials
spec:
  provider:
    kubernetes:
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: odoo-credentials
      remoteNamespace: odoo-credentials
      auth:
        serviceAccount:
          name: credential-reader
          namespace: odoo-credentials
