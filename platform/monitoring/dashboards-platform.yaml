# Platform performance: is the cluster itself healthy, separately from
# whether any single tenant is serving. The traffic panels come from the Envoy
# data plane (see the PodMonitor in monitors.yaml), because nothing in the
# application reports how much traffic it is serving. The resource panels read
# the kubelet's cadvisor metrics and kube-state-metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-odoo-platform
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  odoo-platform.json: |
    {
      "title": "Odoo platform",
      "uid": "odoo-platform",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "tenant",
            "label": "Tenant",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(up{job=~\".+-canary\"}, namespace)", "refId": "A"},
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {"text": "All", "value": "$__all"}
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Gateway requests / second",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(rate(envoy_cluster_upstream_rq_total[5m]))"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 2, "mappings": []}, "overrides": []}
        },
        {
          "id": 2, "type": "stat", "title": "Gateway p95 latency",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket[5m])))"}],
          "fieldConfig": {"defaults": {"unit": "s", "decimals": 3, "mappings": []}, "overrides": []}
        },
        {
          "id": 3, "type": "stat", "title": "Gateway 5xx / second",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "targets": [{"refId": "A", "expr": "sum(rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class=\"5\"}[5m]))"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 3, "mappings": [], "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 4, "type": "stat", "title": "Envoy memory allocated",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "targets": [{"refId": "A", "expr": "envoy_server_memory_allocated"}],
          "fieldConfig": {"defaults": {"unit": "bytes", "mappings": []}, "overrides": []}
        },
        {
          "id": 5, "type": "timeseries", "title": "Requests / second by route",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "targets": [{"refId": "A", "expr": "sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total[5m]))", "legendFormat": "{{envoy_cluster_name}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        },
        {
          "id": 6, "type": "timeseries", "title": "p95 latency by route",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_time_bucket[5m])))", "legendFormat": "{{envoy_cluster_name}}"}],
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        },
        {
          "id": 7, "type": "timeseries", "title": "5xx by route",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "targets": [{"refId": "A", "expr": "sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class=\"5\"}[5m]))", "legendFormat": "{{envoy_cluster_name}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        },
        {
          "id": 8, "type": "timeseries", "title": "Active upstream connections",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "targets": [{"refId": "A", "expr": "envoy_cluster_upstream_cx_active", "legendFormat": "{{envoy_cluster_name}}"}],
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        },
        {
          "id": 9, "type": "timeseries", "title": "Node CPU used vs capacity",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 22},
          "targets": [
            {"refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m]))", "legendFormat": "used"},
            {"refId": "B", "expr": "sum(machine_cpu_cores)", "legendFormat": "capacity"}
          ],
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        },
        {
          "id": 10, "type": "timeseries", "title": "Node memory used vs capacity",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 22},
          "targets": [
            {"refId": "A", "expr": "sum(container_memory_working_set_bytes{container!=\"\",container!=\"POD\"})", "legendFormat": "used"},
            {"refId": "B", "expr": "sum(machine_memory_bytes)", "legendFormat": "capacity"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        },
        {
          "id": 11, "type": "timeseries", "title": "Requested vs allocatable CPU (scheduling headroom)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 30},
          "targets": [
            {"refId": "A", "expr": "sum(kube_pod_container_resource_requests{resource=\"cpu\"})", "legendFormat": "requested"},
            {"refId": "B", "expr": "sum(kube_node_status_allocatable{resource=\"cpu\"})", "legendFormat": "allocatable"}
          ],
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        },
        {
          "id": 12, "type": "timeseries", "title": "Pod CPU usage ($tenant)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 30},
          "targets": [{"refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$tenant\",container!=\"\",container!=\"POD\"}[5m]))", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        },
        {
          "id": 13, "type": "timeseries", "title": "Pod memory as a fraction of its limit ($tenant)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 38},
          "targets": [{"refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$tenant\",container!=\"\",container!=\"POD\"}) / clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace=~\"$tenant\",resource=\"memory\"}), 1)", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1.5, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.8}, {"color": "red", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 14, "type": "timeseries", "title": "CPU throttling ($tenant)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 38},
          "targets": [{"refId": "A", "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=~\"$tenant\"}[5m])) / clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=~\"$tenant\"}[5m])), 1)", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        },
        {
          "id": 15, "type": "timeseries", "title": "Container restarts in the last hour ($tenant)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 46},
          "targets": [{"refId": "A", "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$tenant\"}[1h]))", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        },
        {
          "id": 16, "type": "timeseries", "title": "Available replicas ($tenant)",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 46},
          "targets": [{"refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=~\"$tenant\"}", "legendFormat": "{{deployment}}"}],
          "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "showPoints": "never"}}, "overrides": []}
        }
      ]
    }
