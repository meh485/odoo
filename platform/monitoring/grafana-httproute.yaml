# Grafana behind the platform gateway. The gateway's certificate already covers
# *.odoo.local, so no new certificate is needed and Grafana stays off a NodePort.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: odoo-edge
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - grafana.odoo.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80