# Observability, trimmed for the local cluster and hardened to the `restricted`
# Pod Security Standard the monitoring namespace enforces.
#
# Deliberately disabled:
#   - node-exporter, which needs host access that restricted forbids; the
#     signals this project pages on come from the tenants, not the node.
#   - the default rule set, because the chart in charts/odoo-tenant ships the
#     rules that matter.
#   - the control-plane monitors (etcd, scheduler, controller-manager), whose
#     endpoints kubeadm binds to 127.0.0.1 and are therefore unscrapable from
#     the pod network. That is a kubeadm and kind trait, not a property of this
#     deployment; a managed control plane would enable them and the monitors
#     would already be correct.
#
# kube-state-metrics is kept: the container restart metrics on the
# tenant-health dashboard come from it.
#
# Selecting rules, ServiceMonitors and PodMonitors in every namespace is what
# makes a new tenant observable the moment its namespace exists: there is no
# target list to remember to update.
prometheusOperator:
  enabled: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 24h
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    # No external pager on a demo cluster: alerts are visible in the
    # Alertmanager UI and in Prometheus, routed to a null receiver.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }
    storage: {}

grafana:
  # Grafana runs locally so the dashboards are clickable. It is exposed through
  # the existing gateway rather than a NodePort, and its dashboards are
  # provisioned from ConfigMaps rather than clicked into existence.
  enabled: true
  replicas: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  resources:
    # Grafana 13 keeps its dashboard store and search index in memory; 256Mi
    # was OOMKilled on startup.
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }
  # Nothing to keep: dashboards come from ConfigMaps and the database is a
  # demo.
  persistence:
    enabled: false
  defaultDashboardsEnabled: false
  env:
    # The monitoring namespace has no route to grafana.com, so the preinstalled
    # apps and phone-home calls must not block startup.
    GF_PLUGINS_PREINSTALL_DISABLED: "true"
    GF_ANALYTICS_REPORTING_ENABLED: "false"
    GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    GF_NEWS_NEWS_FEED_ENABLED: "false"
  sidecar:
    dashboards:
      # Picks up any ConfigMap labelled grafana_dashboard in this namespace.
      enabled: true
      label: grafana_dashboard
  # The Prometheus datasource is provisioned by the chart itself (uid
  # "prometheus"); adding another default here made Grafana refuse to start,
  # because only one datasource per organization may be the default.

# Node-exporter is off at its real gate. Chart 91.x gates the subchart on
# `nodeExporter.enabled`; the older `prometheus-node-exporter.enabled` key is
# inert, which left the DaemonSet deployed and silently stuck at 0 ready under
# the restricted standard this namespace enforces.
nodeExporter:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

# kube-proxy is included for the same reason as the three above: kind runs it
# with its metrics address bound to 127.0.0.1, so the node-address scrape can
# never succeed. kubelet and CoreDNS are kept and do work.
kubeProxy:
  enabled: false

defaultRules:
  create: false