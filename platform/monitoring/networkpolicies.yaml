# The monitoring namespace denies everything by default. These are the named
# flows the observability stack needs, so a scrape cannot silently fail behind
# a default-deny policy whose only symptom is an empty graph.
---
# Prometheus reaches the tenants and the rest of the stack. DNS is already
# allowed namespace-wide.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-prometheus-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Egress]
  egress:
    # The API server, for service and endpoint discovery. Without it Prometheus
    # discovers nothing and every graph is silently empty.
    - to:
        - ipBlock:
            cidr: 172.19.0.0/16
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    # Every tenant's Postgres, pooler and canary metrics.
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: odoo
      ports:
        - { protocol: TCP, port: 9187 }
        - { protocol: TCP, port: 9127 }
        - { protocol: TCP, port: 9101 }
        # The tenant's database-domain exporter (sql_exporter's default port).
        - { protocol: TCP, port: 9399 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kube-state-metrics
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - { protocol: TCP, port: 9093 }
    - to:
        - podSelector:
            matchLabels:
              app: pushgateway
      ports:
        - { protocol: TCP, port: 9091 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-alertmanager-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { protocol: TCP, port: 9093 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-kube-state-metrics-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { protocol: TCP, port: 8080 }
---
# Grafana, added separately, reads Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-prometheus-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        # The node network, so `kubectl port-forward` and the API server proxy
        # can reach the UI. This is the kind-local network, the same kind of
        # accommodation as the gateway's NodePort.
        - ipBlock:
            cidr: 172.19.0.0/16
      ports:
        - { protocol: TCP, port: 9090 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-allow-alertmanager-ui
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 172.19.0.0/16
      ports:
        - { protocol: TCP, port: 9093 }