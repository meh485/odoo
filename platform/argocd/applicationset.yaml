# One Application per file in tenants/. This is the tenant provisioning path:
# adding a customer is a commit, removing one is a deletion, and drift is
# reconciled continuously.
#
# acme is excluded rather than absent: it was installed by `helm upgrade` before
# ArgoCD existed on this cluster, and two owners for one set of objects is
# exactly the conflict this repository already hit once, with the CloudNativePG
# PodMonitors. Adopting it is a deliberate act -- drop the exclude and stop
# using `make tenant` for that tenant -- and until then it is a limit recorded
# in DESIGN.md.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: odoo-tenants
  namespace: argocd
spec:
  # Required for the {{.tenant.name}} placeholders below. Without it the
  # controller uses fasttemplate syntax, does not substitute them, and tries to
  # create an Application literally named "odoo-{{.tenant.name}}" -- which the
  # API server rejects, so the generator produces nothing at all.
  goTemplate: true
  generators:
    - git:
        repoURL: git@github.com:meh485/odoo.git
        revision: main
        files:
          - path: "tenants/*.yaml"
          - path: "tenants/acme.yaml"
            exclude: true
  template:
    metadata:
      name: "odoo-{{.tenant.name}}"
    spec:
      project: odoo
      source:
        repoURL: git@github.com:meh485/odoo.git
        targetRevision: main
        path: charts/odoo-tenant
        helm:
          valueFiles:
            - "../../tenants/{{.tenant.name}}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.tenant.name}}"
      syncPolicy:
        automated:
          selfHeal: true
          # Never prune: removing an Application would delete the namespace and
          # with it the tenant's PersistentVolumeClaims, so offboarding stays a
          # deliberate, reviewed act rather than a reconciliation side effect.
          prune: false
        syncOptions:
          # The chart owns the Namespace object, so ArgoCD must not create it.
          - CreateNamespace=false