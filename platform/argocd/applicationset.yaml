# One Application per file in tenants/. This is the tenant provisioning path:
# adding a customer is a commit, removing one is a deletion, and drift is
# reconciled continuously.
#
# Every tenant is managed here, including acme, which predates ArgoCD on this
# cluster. It was adopted rather than rebuilt: the chart declares the same
# objects, and the credentials were already in the store, so ArgoCD took over
# without rotating anything.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: odoo-tenants
  namespace: argocd
spec:
  # Required for the {{.tenant.name}} placeholders below. Without it the
  # controller uses fasttemplate syntax, does not substitute them, and tries to
  # create an Application literally named "odoo-{{.tenant.name}}" -- which the
  # API server rejects, so the generator produces nothing at all.
  goTemplate: true
  generators:
    - git:
        repoURL: git@github.com:meh485/odoo.git
        revision: main
        files:
          - path: "tenants/*.yaml"
  template:
    metadata:
      name: "odoo-{{.tenant.name}}"
    spec:
      project: odoo
      source:
        repoURL: git@github.com:meh485/odoo.git
        targetRevision: main
        path: charts/odoo-tenant
        helm:
          valueFiles:
            - "../../tenants/{{.tenant.name}}.yaml"
          parameters:
            # The one-time Jobs have to be ArgoCD-ordered resources rather than
            # Helm hooks; see the comment on argocd.enabled in the chart's
            # values for why the two cannot be the same object.
            - name: argocd.enabled
              value: "true"
            # Credentials are declared as ExternalSecrets and materialised by
            # the operator, so no Secret has to exist before the first sync.
            # Local store; production points at the Vault-backed one.
            - name: credentials.externalSecrets.enabled
              value: "true"
            - name: credentials.externalSecrets.store
              value: tenant-credentials
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.tenant.name}}"
      syncPolicy:
        automated:
          selfHeal: true
          # Never prune: removing an Application would delete the namespace and
          # with it the tenant's PersistentVolumeClaims, so offboarding stays a
          # deliberate, reviewed act rather than a reconciliation side effect.
          prune: false
        syncOptions:
          # The chart owns the Namespace object, so ArgoCD must not create it.
          - CreateNamespace=false