# Owned by the platform team. Tenants attach their own HTTPRoute from their own
# namespace and never edit this object, which is the ownership split that makes
# Gateway API a better fit than Ingress at several hundred customers.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: odoo-edge
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    # Plain HTTP exists only to redirect. Browsers treat a non-localhost HTTP
    # origin as an insecure context, which silently removes navigator.clipboard,
    # service workers and other APIs Odoo's UI expects.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          # Self-signed for local development. In production this Secret is
          # issued by cert-manager; nothing else in this file changes.
          - kind: Secret
            name: odoo-edge-tls
      allowedRoutes:
        namespaces:
          from: All
