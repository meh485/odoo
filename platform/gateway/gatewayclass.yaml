# Gateway API is a specification; it needs an implementation behind it.
# Envoy Gateway provides one. ingress-nginx, which minikube and many clusters
# ship by default, entered retirement in March 2026.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: odoo-edge-proxy
    namespace: envoy-gateway-system
