tenant:
  name: newco
  hostname: newco.odoo.local

odoo:
  web:
    replicas: 1
    workers: 2

postgres:
  instances: 1

backup:
  # Credentials are seeded from the object store's credential, not committed.
  enabled: true
  destinationPath: "s3://odoo-backups/newco"
  endpointURL: "http://minio.storage.svc.cluster.local:9000"
  filestore:
    enabled: true
    repository: "s3:http://minio.storage.svc.cluster.local:9000/odoo-backups/newco-filestore"

network:
  egress:
    internet:
      # The in-app module browser and payment/OAuth callbacks reach out.
      # Enabled for this tenant; the chart default stays false.
      enabled: true
