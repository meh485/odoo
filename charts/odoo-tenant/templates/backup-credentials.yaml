{{- $tenant := include "odoo.tenant" . }}
{{- if .Values.backup.enabled }}
{{- $secretName := printf "%s-backup-credentials" $tenant }}
{{- /*
  Preserve an existing backup credential across upgrades; regenerating it would
  silently strand every future backup in an auth failure. Where the platform
  has already created this Secret (from its credential store), those values win.
  In production this Secret is supplied by External Secrets Operator.
*/ -}}
{{- $existing := lookup "v1" "Secret" $tenant $secretName }}
{{- $accessKey := "" }}
{{- $secretKey := "" }}
{{- if $existing }}
{{- $accessKey = index $existing.data "ACCESS_KEY_ID" | b64dec }}
{{- $secretKey = index $existing.data "ACCESS_SECRET_KEY" | b64dec }}
{{- else if and .Values.backup.accessKeyId .Values.backup.secretAccessKey }}
{{- $accessKey = .Values.backup.accessKeyId }}
{{- $secretKey = .Values.backup.secretAccessKey }}
{{- else }}
{{- $accessKey = randAlphaNum 24 }}
{{- $secretKey = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
type: Opaque
data:
  ACCESS_KEY_ID: {{ $accessKey | b64enc | quote }}
  ACCESS_SECRET_KEY: {{ $secretKey | b64enc | quote }}
{{- end }}