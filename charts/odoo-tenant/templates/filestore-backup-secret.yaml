{{- $tenant := include "odoo.tenant" . }}
{{- if and .Values.backup.enabled .Values.backup.filestore.enabled }}
{{- $secretName := printf "%s-restic" $tenant }}
{{- /*
  Preserve an existing restic password across upgrades. Regenerating it would
  make every snapshot already written unreadable, which is the opposite of a
  backup. In production this Secret is supplied by External Secrets Operator.
*/ -}}
{{- $existing := lookup "v1" "Secret" $tenant $secretName }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "restic_password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
type: Opaque
data:
  restic_password: {{ $password | b64enc | quote }}
{{- end }}