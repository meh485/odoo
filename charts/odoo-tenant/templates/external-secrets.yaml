{{- if .Values.credentials.externalSecrets.enabled }}
{{- $tenant := include "odoo.tenant" . }}
{{- $cfg := .Values.credentials.externalSecrets }}
{{- $remote := $cfg.remoteKey | default $tenant }}
{{- $storeName := $cfg.store | default (printf "%s-credentials" $tenant) }}
{{- $storeKind := $cfg.storeKind | default "SecretStore" }}
{{- $reader := printf "%s-credential-reader" $tenant }}
{{- if and (not $cfg.store) (not $cfg.reader.enabled) }}
{{- fail "credentials.externalSecrets.store may only be empty when reader.enabled is true: the chart then creates both the per-tenant store and the reader it authenticates with" }}
{{- end }}
{{- /*
  One reader per tenant, instead of one reader for the shared namespace.

  The credentials namespace holds every tenant's Secret. A single reader in it
  has to be granted `get` across all of them, so any namespace allowed to create
  an ExternalSecret could name another tenant's key and read it: the blast
  radius of one mistake would be every customer at once.

  Scoping this Role with resourceNames means the reader can read this tenant's
  Secret and nothing else in that namespace. The ServiceAccount lives in the
  tenant's own namespace on purpose: it is only ever an identity whose token
  reaches credentials that namespace already mounts, so it grants no privilege a
  workload there does not already have.
*/ -}}
{{- if $cfg.reader.enabled }}
{{- $readerNS := $cfg.reader.namespace | default "odoo-credentials" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $reader }}
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
# Nothing runs as this identity; the operator only needs to mint a token for it.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $reader }}
  namespace: {{ $readerNS }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    # The security boundary: not the namespace, one named Secret.
    resourceNames: ["{{ $remote }}"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $reader }}
  namespace: {{ $readerNS }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $reader }}
    namespace: {{ $tenant }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $reader }}
{{- end }}
{{- if not $cfg.store }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $storeName }}
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
  annotations:
    # Wave 1, with the ExternalSecrets that read it.
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    kubernetes:
      server:
        url: https://kubernetes.default.svc
        # No namespace: External Secrets requires it to be empty for a
        # namespaced store, and reads the CA from the store's own namespace.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      remoteNamespace: {{ $cfg.reader.namespace | default "odoo-credentials" }}
      auth:
        serviceAccount:
          name: {{ $reader }}
{{- end }}
{{- /*
  The four Secrets this chart references, declared rather than generated. Each
  ExternalSecret lives in the tenant's namespace, so it is applied in the same
  sync as the namespace itself and the operator materialises the Secret before
  the jobs that mount it -- which is why this ordering problem disappears here
  but had to be worked around with a seed script.

  The Secret names and keys are unchanged: consumers still mount
  {tenant}-odoo-admin and friends, they are simply produced by the operator now.
*/ -}}
{{- $secrets := list
      (dict "suffix" "odoo-admin" "data" (list (dict "key" "admin_passwd" "property" "admin_passwd")))
      (dict "suffix" "canary" "data" (list (dict "key" "canary_password" "property" "canary_password")))
}}
{{- if .Values.backup.filestore.enabled }}
{{- $secrets = append $secrets (dict "suffix" "restic" "data" (list (dict "key" "restic_password" "property" "restic_password"))) }}
{{- end }}
{{- if .Values.backup.enabled }}
{{- $secrets = append $secrets (dict "suffix" "backup-credentials" "data" (list
      (dict "key" "ACCESS_KEY_ID" "property" "ACCESS_KEY_ID")
      (dict "key" "ACCESS_SECRET_KEY" "property" "ACCESS_SECRET_KEY"))) }}
{{- end }}
{{- range $secret := $secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $tenant }}-{{ $secret.suffix }}
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" $ | nindent 4 }}
  annotations:
    # Wave 1: the operator needs the target Secret to exist well before the
    # schema-init job at wave 3 mounts it, and the job's own retries cover the
    # gap between this being applied and the operator reconciling it.
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Short on purpose: a credential rotated in the store should reach the tenant
  # without waiting an hour, and a failed read is retried soon.
  refreshInterval: 15m
  secretStoreRef:
    name: {{ $storeName }}
    kind: {{ $storeKind }}
  target:
    name: {{ $tenant }}-{{ $secret.suffix }}
    # The operator owns these Secrets; deleting the ExternalSecret removes them.
    creationPolicy: Owner
  data:
    {{- range $entry := $secret.data }}
    - secretKey: {{ $entry.key }}
      remoteRef:
        key: {{ $remote }}
        property: {{ $entry.property }}
    {{- end }}
{{- end }}
{{- end }}
