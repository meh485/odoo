{{- $tenant := include "odoo.tenant" . }}
{{- if .Values.observability.enabled }}
{{- if .Values.canary.enabled }}
# The canary exposes its gauges on its Service; scraping them is what turns a
# tenant that stopped answering into an alert.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $tenant }}-canary
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "odoo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: canary
  endpoints:
    - port: metrics
      interval: 30s
---
{{- end }}
# CloudNativePG exposes the metrics the backup rules read. Scraped explicitly
# rather than relying on the operator's own PodMonitor, so the wiring is
# visible in the chart and covered by a test.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $tenant }}-db
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $tenant }}-db
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $tenant }}-pooler
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/poolerName: {{ $tenant }}-pooler
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
# The database-domain exporter, which surfaces the Odoo-level silent failures
# that CloudNativePG's metrics cannot see.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $tenant }}-sql-exporter
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "odoo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sql-exporter
  endpoints:
    - port: metrics
      interval: 30s
---
# The silent-failure catalogue: the conditions where Odoo keeps serving while
# something important has quietly stopped. These are the alerts that fire when
# nobody is watching a graph.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $tenant }}-silent-failures
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  groups:
    - name: {{ $tenant }}.backup
      rules:
        - alert: OdooBackupStale
          # The daily base backup runs at 02:00; 26h catches a single missed run.
          # A cluster that has never taken a backup reports the timestamp as
          # zero, and `time() - 0` is always stale, so without the guard every
          # new tenant pages on its very first scrape.
          expr: |
            time() - cnpg_collector_last_available_backup_timestamp{namespace="{{ $tenant }}"} > 93600
              and
            cnpg_collector_last_available_backup_timestamp{namespace="{{ $tenant }}"} > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "No successful database backup for {{ $tenant }} in over 26 hours"
        - alert: OdooBackupMissing
          # The other half of the story: a cluster whose first backup never
          # completes stays at zero forever, which the staleness rule above
          # deliberately ignores. 26h here means the first scheduled run was
          # missed, not that the tenant is new.
          expr: cnpg_collector_last_available_backup_timestamp{namespace="{{ $tenant }}"} == 0
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "{{ $tenant }} has never completed a database backup"
        - alert: OdooWalArchivingStalled
          expr: cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="{{ $tenant }}"} > 300
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "WAL archiving has stopped for {{ $tenant }}"
        - alert: OdooWalArchiveFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count{namespace="{{ $tenant }}"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "WAL archiving is failing for {{ $tenant }}"
    - name: {{ $tenant }}.restore
      rules:
        # The drill reports the one thing a backup cannot: whether it restores.
        - alert: OdooRestoreDrillFailed
          expr: odoo_restore_drill_success{tenant="{{ $tenant }}"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "The last restore drill failed for {{ $tenant }}"
        - alert: OdooRestoreDrillStale
          expr: time() - odoo_restore_drill_last_run_timestamp_seconds{tenant="{{ $tenant }}"} > 691200
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "No restore drill has run for {{ $tenant }} in over 8 days"
    - name: {{ $tenant }}.canary
      rules:
        - alert: OdooCanaryFailed
          expr: odoo_canary_success{tenant="{{ $tenant }}"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "The login canary is failing for {{ $tenant }}"
        - alert: OdooCanaryStale
          expr: time() - odoo_canary_last_run_timestamp_seconds{tenant="{{ $tenant }}"} > 600
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The canary has not run for {{ $tenant }} in over 10 minutes"
    - name: {{ $tenant }}.odoo-domain
      rules:
        # These fire on Odoo's own data, where the application looks healthy
        # while work has quietly stopped.
        - alert: OdooCronStalled
          expr: odoo_cron_overdue_seconds{namespace="{{ $tenant }}"} > 7200
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Scheduled jobs for {{ $tenant }} are over two hours overdue"
        - alert: OdooMailQueueStalled
          expr: odoo_mail_outgoing_age_seconds{namespace="{{ $tenant }}"} > 1800
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Email for {{ $tenant }} has been queued for over 30 minutes"
        - alert: OdooMailBacklog
          expr: odoo_mail_queue_depth{namespace="{{ $tenant }}"} > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The outbound mail queue for {{ $tenant }} is over 100"
        - alert: OdooAttachmentDrift
          expr: abs(odoo_attachment_filestore{namespace="{{ $tenant }}"} - (odoo_attachment_total{namespace="{{ $tenant }}"} - odoo_attachment_database{namespace="{{ $tenant }}"})) > 10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Attachments and their rows disagree for {{ $tenant }}"
        - alert: OdooLockContention
          expr: pg_blocked_query_age_seconds{namespace="{{ $tenant }}"} > 300
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "A query for {{ $tenant }} has been blocked for over 5 minutes"
{{- end }}