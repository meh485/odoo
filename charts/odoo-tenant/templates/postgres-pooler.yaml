{{- $tenant := include "odoo.tenant" . }}
{{- if ne .Values.postgres.pooler.poolMode "session" }}
{{- fail "postgres.pooler.poolMode must be 'session': Odoo relies on prepared statements and session state, which transaction pooling breaks intermittently" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ $tenant }}-pooler
  namespace: {{ $tenant }}
  annotations:
    # Wave 2, after its Cluster. The schema init job connects through the
    # pooler, so the pooler has to exist before the job at wave 3 runs.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  cluster:
    name: {{ $tenant }}-db
  instances: {{ .Values.postgres.pooler.instances }}
  type: rw
  pgbouncer:
    poolMode: {{ .Values.postgres.pooler.poolMode }}
    parameters:
      max_client_conn: {{ .Values.postgres.pooler.maxClientConn | quote }}
      default_pool_size: {{ .Values.postgres.pooler.defaultPoolSize | quote }}
  monitoring:
    # See the Cluster: the chart owns this PodMonitor, and enabling the
    # operator's as well makes two managers fight over the same object.
    enablePodMonitor: false
