{{- $tenant := include "odoo.tenant" . }}
{{- $secretName := printf "%s-odoo-admin" $tenant }}
{{- /*
  Preserve an existing admin password across upgrades. Regenerating it on every
  `helm upgrade` would silently change the master password of a live tenant.
  In production this Secret is supplied by External Secrets Operator from Vault
  and the generator below never runs.
*/ -}}
{{- $existing := lookup "v1" "Secret" $tenant $secretName }}
{{- $admin := "" }}
{{- if $existing }}
{{- $admin = index $existing.data "admin_passwd" | b64dec }}
{{- else }}
{{- $admin = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
type: Opaque
data:
  admin_passwd: {{ $admin | b64enc | quote }}
