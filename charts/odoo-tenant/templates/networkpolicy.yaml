{{- $tenant := include "odoo.tenant" . }}
# Deny everything, then permit named flows. Every allow below exists because a
# specific component needs it; anything not listed cannot talk to anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $tenant }}-default-deny
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $tenant }}-allow-dns
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $tenant }}-allow-gateway-to-web
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "odoo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - { protocol: TCP, port: 8069 }
        - { protocol: TCP, port: 8072 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $tenant }}-allow-odoo-to-pooler
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: {{ $tenant }}-pooler
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "odoo.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $tenant }}-allow-odoo-egress-to-pooler
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "odoo.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: {{ $tenant }}-pooler
      ports:
        - { protocol: TCP, port: 5432 }
---
# The pooler must reach the Postgres instances the operator manages, and the
# instances must reach each other for replication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $tenant }}-allow-postgres-internal
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $tenant }}-db
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $tenant }}-db
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: {{ $tenant }}-pooler
      ports:
        - { protocol: TCP, port: 5432 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $tenant }}-db
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $tenant }}-allow-prometheus-scrape
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 9187 }
        - { protocol: TCP, port: 9399 }
        - { protocol: TCP, port: 9101 }
        - { protocol: TCP, port: 9127 }
---
# The instance manager must reach the Kubernetes API, and Postgres must reach
# object storage for WAL archiving. Both peers are named: a blanket
# 0.0.0.0/0 egress would let a compromised database pod reach any host.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $tenant }}-allow-postgres-egress-apiserver
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $tenant }}-db
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ required "network.apiServerCIDR is required" .Values.network.apiServerCIDR | quote }}
      ports:
        - { protocol: TCP, port: {{ .Values.network.apiServerPort }} }
        - { protocol: TCP, port: 443 }
{{- if .Values.backup.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $tenant }}-allow-postgres-egress-backup
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $tenant }}-db
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.network.backupNamespace }}
      ports:
        - { protocol: TCP, port: {{ .Values.network.backupPort }} }
{{- end }}
