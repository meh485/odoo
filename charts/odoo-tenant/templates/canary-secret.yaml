{{- $tenant := include "odoo.tenant" . }}
{{- $secretName := printf "%s-canary" $tenant }}
{{- /*
  Preserve the canary password across upgrades. Regenerating it would leave the
  probe authenticating with a credential the database no longer accepts, which
  presents as a tenant outage that is not real -- the worst kind of monitoring
  failure, because it trains people to ignore the alert.
*/ -}}
{{- $existing := lookup "v1" "Secret" $tenant $secretName }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "canary_password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $tenant }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
type: Opaque
data:
  canary_password: {{ $password | b64enc | quote }}
