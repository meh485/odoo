{{- $tenant := include "odoo.tenant" . }}
# Odoo stores attachments on disk. Losing this volume breaks every attachment
# in the database, so it is a first-class persistent claim, not scratch space.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $tenant }}-filestore
  namespace: {{ $tenant }}
  annotations:
    # Wave 3, in the same wave as its first consumer. The storage class binds on
    # first consumer, so the claim is Pending -- and therefore not Healthy to
    # ArgoCD -- until a pod mounts it. An earlier wave would gate the sync on a
    # resource that cannot become ready yet.
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.odoo.filestore.size }}
  {{- with .Values.odoo.filestore.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
