# Every value a tenant may override. A tenant's values file in tenants/
# should need only a handful of these.

credentials:
  externalSecrets:
    # Declare ExternalSecrets for the four credentials this chart references,
    # so the operator materialises them instead of expecting them to exist.
    # This is the production shape: the store is Vault there and a platform
    # namespace here, and nothing else about the tenant changes.
    enabled: false
    # The ClusterSecretStore to read from. Required when enabled.
    store: ""
    # The key the tenant's credentials live under in the store. Defaults to the
    # tenant name, which is what the seeding script writes.
    remoteKey: ""

tenant:
  # Becomes the namespace name and the Odoo database name.
  name: ""
  hostname: ""

argocd:
  # Set by the ApplicationSet, never by `helm install`.
  #
  # The one-time Jobs cannot be a Helm hook and an ordered ArgoCD resource at
  # once. ArgoCD maps `post-install` to PostSync, which runs only after every
  # other resource is healthy -- and the web Deployment cannot be healthy until
  # the schema exists, so the sync waits on a resource that waits on the job.
  # With this true the Jobs carry ArgoCD's own annotations instead, ordered by
  # sync-wave so they still run after the database and before the workloads.
  enabled: false

odoo:
  image:
    # Custom image: upstream's entrypoint passes the database password as a
    # command-line argument, where it is visible in the process list. Ours
    # merges it into a 0600 config file instead.
    repository: odoo-app
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  web:
    replicas: 2
    workers: 2
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }
  cron:
    # Separate from web: a long-running scheduled job in the web process
    # competes with user requests for the same workers.
    replicas: 1
    maxCronThreads: 2
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
  filestore:
    size: 10Gi
    storageClass: ""
  logLevel: info
  adminPassword:
    # A Secret that already holds the admin password under the key
    # admin_passwd. The chart only references it; it never creates it.
    #
    # A password generated during a render makes the manifests depend on
    # cluster state. Argo CD cannot run Helm's lookup, so it would generate a
    # new password on every sync: the value would change, and the application
    # would never report Synced.
    #
    # Empty means the default name, {tenant}-odoo-admin. Locally
    # scripts/seed-admin-credentials.sh creates it once; in production
    # External Secrets Operator fills the same Secret from Vault, and neither
    # this value nor any template changes.
    existingSecret: ""

postgres:
  instances: 2
  storage:
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  pooler:
    instances: 1
    # Session pooling, never transaction: Odoo relies on prepared statements
    # and session state, which transaction pooling breaks intermittently.
    poolMode: session
    maxClientConn: 200
    defaultPoolSize: 25

canary:
  # Synthetic probe that logs in and reads a record. /web/health returned 200
  # on this cluster while the database had no schema and every real request
  # failed, which is why the probe authenticates instead of checking health.
  enabled: true
  # Name of a Secret holding the probe's password under canary_password. The
  # chart references it and never creates it, for the same reason as the admin
  # password: a value generated during a render changes on every render, so
  # Argo CD would never report Synced. Defaults to {tenant}-canary, which
  # scripts/seed-tenant-credentials.sh creates locally and External Secrets
  # fills in production.
  existingSecret: ""
  image:
    repository: odoo-canary
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  intervalSeconds: 30
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }

backup:
  enabled: false
  destinationPath: ""
  endpointURL: ""
  # CloudNativePG uses the Go cron format, which includes a seconds field.
  # Kubernetes CronJob expressions are five fields and would run at the wrong
  # time here -- a five-field entry is accepted, not rejected.
  schedule: "0 0 2 * * *"
  retentionPolicy: "30d"
  # Name of a Secret holding ACCESS_KEY_ID and ACCESS_SECRET_KEY for the object
  # store. Referenced, never created, for the same reason as every other
  # credential here. Empty means {tenant}-backup-credentials, which
  # scripts/seed-backup-credentials.sh fills from the object store's own
  # credential; External Secrets fills the same Secret in production.
  existingSecret: ""
  drillImage:
    repository: odoo-restore-drill
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # Weekly, at 04:00, clear of the 02:00 backup window. A restore running while
  # the base backup it depends on is being written would prove nothing.
  drillSchedule: "0 4 * * 0"
  filestore:
    # Odoo keeps attachments on the filesystem, not in the database. Capturing
    # only the database restores a tenant whose invoices and images are all
    # missing, so the filestore is backed up separately, to its own repository.
    enabled: false
    # Name of the Secret holding restic_password. Referenced, never generated:
    # a restic password that changed on every render would make every existing
    # snapshot unreadable. Defaults to {tenant}-restic.
    existingSecret: ""
    # 02:30, after the 02:00 database backup has started.
    schedule: "30 2 * * *"
    # e.g. s3:http://minio.storage.svc.cluster.local:9000/odoo-backups/acme-filestore
    repository: ""
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6
    image:
      repository: odoo-filestore-backup
      tag: "0.1.0"
      pullPolicy: IfNotPresent

gateway:
  # The shared Gateway the platform team owns. Tenants attach to it.
  name: odoo-edge
  namespace: envoy-gateway-system
  # The TLS listener. Tenants are never served over the plaintext listener.
  listener: https

network:
  # Postgres instances must reach the Kubernetes API (the CloudNativePG
  # instance manager) and object storage (WAL archiving). Both are named
  # explicitly rather than allowed as 0.0.0.0/0, so a compromised database
  # pod cannot reach arbitrary hosts.
  apiServerCIDR: "172.19.0.0/16"
  apiServerPort: 6443
  backupNamespace: storage
  backupPort: 9000
  # Where the restore drill pushes its metrics. Batch jobs cannot be scraped
  # directly, so they push and Prometheus scrapes the Pushgateway.
  pushgatewayNamespace: monitoring
  pushgatewayPort: 9091

  egress:
    # Outbound mail. Named explicitly because a tenant that cannot send mail
    # looks healthy while invoices silently never arrive.
    smtp:
      enabled: false
      cidr: ""
      port: 587

    # Odoo's in-app module browser calls apps.odoo.com, and payment or OAuth
    # integrations call their providers. Blocked by default: unrestricted
    # egress from an application server is the route data takes after a
    # compromise, and the module browser is a phone-home to Odoo SA that most
    # deployments do not want.
    #
    # Enable per tenant, and prefer listing the destinations you actually need
    # over opening everything.
    internet:
      enabled: false
      # Applied only when internet.enabled is true. RFC1918 ranges and the
      # cloud metadata endpoint stay excluded regardless, so "internet" never
      # means "the rest of the cluster" or "the node's credentials".
      ports: [443]

quota:
  # Sized with headroom for a rolling update and the init job, not just for
  # steady state. A quota that exactly fits the running pods blocks its own
  # rollout: the surge pod is rejected and the old ReplicaSet cannot be
  # replaced, which presents as a deployment that hangs for no visible reason.
  requestsCPU: "6"
  requestsMemory: 8Gi
  limitsCPU: "14"
  limitsMemory: 16Gi
  persistentVolumeClaims: "6"

observability:
  # ServiceMonitors, PodMonitors and the silent-failure alert rules for this
  # tenant. Requires the Prometheus Operator CRDs, which the platform installs
  # together with the monitoring stack.
  enabled: true
  sqlExporter:
    # Queries Odoo's own tables for the failures that leave it serving while
    # silently broken: a stalled scheduler, mail that never leaves the queue,
    # attachments drifting from their rows, a query blocked on a lock.
    image:
      repository: burningalchemist/sql_exporter
      tag: "0.15.0"
      pullPolicy: IfNotPresent
